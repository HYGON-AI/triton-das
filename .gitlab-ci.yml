stages:
  - build
  - publish
  - mirror

variables:
  FILE_SERVER_IP: "10.16.1.27"
  FILE_SERVER_USER: "fileowner"
  PIP_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  PIP_TRUSTED_HOST: "10.16.1.201"
  DTK_PKG: "/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DEVPI_URL: "http://10.16.1.201:9929/"
  CISMI_TIMEOUT: "3600"
  TORCH_VERSION: "2.11.0"
  # GitHub mirror target (override in CI Variables if needed).
  # Auth: set masked CI Variable GITHUB_MIRROR_TOKEN (fine-grained PAT with contents:write).
  GITHUB_MIRROR_REPO: "github.com/HYGON-AI/triton-das.git"

build:triton-wheel:
  stage: build
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(release\/|staging)/'
  tags:
    - nmz
  before_script:
    # 安装 DTK
    - cp -f ${DTK_PKG} /opt/
    - cd /opt && tar -xzf $(basename ${DTK_PKG}) && mv dtk-* dtk
    - source /opt/dtk/env.sh && cd ${CI_PROJECT_DIR}
    # 安装 AICC
    - src_dir="/ArchivedFile/ai_cc/nightly"
    - latest_run=$(cd "$src_dir" && ls dtk_llvm_*.run 2>/dev/null | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
    - 'echo "完整安装包路径: ${src_dir}/${latest_run}.run"'
    - test -n "${latest_run}" && cp "${src_dir}/${latest_run}.run" ./ && chmod +x "${latest_run}.run" && yes | bash "${latest_run}.run" && echo "AICC 安装完成" || echo "跳过 AICC 安装"
    # git 免密配置 (GIT_ASKPASS 方式，不修改 remote URL)
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod +x /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 GIT_TOKEN="${CI_JOB_TOKEN}"
    # 合并目标分支
    - git config user.email "ci@.local" && git config user.name "CI"
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git merge origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --no-edit
    - pip install -r python/requirements.txt -r python/test-requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
    - pip install torch==${TORCH_VERSION} cismi auditwheel patchelf==0.17.2.4
    - pip install numpy==1.24.3
    - pip install amdsmi==1.0.0+630c16a6.dirty
    - yum install -y expect rsync
  script:
    - export FILE_SERVER_PWD_DECODED=$(echo -n "${FILE_SERVER_PWD}" | base64 -d)
    - test -n "${HCU_LLVM_TRITON_GIT_URL}" || (echo "HCU_LLVM_TRITON_GIT_URL is not set" && exit 1)
    - bash scripts/hcu/gen_triton_wheel.sh
        --llvm_repo "http://gitlab-ci-token:${CI_JOB_TOKEN}@${HCU_LLVM_TRITON_GIT_URL}"
        --file_server_ip "${FILE_SERVER_IP}"
        --file_server_user "${FILE_SERVER_USER}"
        --file_server_pwd "${FILE_SERVER_PWD_DECODED}"
    # manylinux repair
    - bash scripts/hcu/repair_manylinux.sh
    - pip install dist/*manylinux*.whl
    - export HIP_VISIBLE_DEVICES=$(CIsmi need 1 --timeout ${CISMI_TIMEOUT})
    - bash third_party/hcu/test/regression.sh
    - python -m pytest -s third_party/hcu/test/test_hcutuner.py
    - python -m pytest -s third_party/hcu/test/test_fast_jit.py
  artifacts:
    paths:
      - dist/*.whl
      - third_party/hcu/test/hcu_regression.xml
    reports:
      junit: third_party/hcu/test/hcu_regression.xml
    expire_in: 7 days

publish:
  stage: publish
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME =~ /^(release\/|staging)/'
  tags:
    - nmz
  parallel:
    matrix:
      - TORCH_VERSION: ["2.10.0", "2.11.0"]
  before_script:
    # 安装 DTK
    - cp -f ${DTK_PKG} /opt/
    - cd /opt && tar -xzf $(basename ${DTK_PKG}) && mv dtk-* dtk
    - source /opt/dtk/env.sh && cd ${CI_PROJECT_DIR}
    # 安装 AICC
    - src_dir="/ArchivedFile/ai_cc/nightly"
    - latest_run=$(cd "$src_dir" && ls dtk_llvm_*.run 2>/dev/null | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
    - 'echo "完整安装包路径: ${src_dir}/${latest_run}.run"'
    - test -n "${latest_run}" && cp "${src_dir}/${latest_run}.run" ./ && chmod +x "${latest_run}.run" && yes | bash "${latest_run}.run" && echo "AICC 安装完成" || echo "跳过 AICC 安装"
    # git 免密配置 (GIT_ASKPASS 方式，不修改 remote URL)
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod +x /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 GIT_TOKEN="${CI_JOB_TOKEN}"
    - pip install -r python/requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
    - pip install torch==${TORCH_VERSION} ciupload auditwheel patchelf==0.17.2.4
  script:
    - export FILE_SERVER_PWD_DECODED=$(echo -n "${FILE_SERVER_PWD}" | base64 -d)
    - test -n "${HCU_LLVM_TRITON_GIT_URL}" || (echo "HCU_LLVM_TRITON_GIT_URL is not set" && exit 1)
    - bash scripts/hcu/gen_triton_wheel.sh
        --llvm_repo "http://gitlab-ci-token:${CI_JOB_TOKEN}@${HCU_LLVM_TRITON_GIT_URL}"
        --file_server_ip "${FILE_SERVER_IP}"
        --file_server_user "${FILE_SERVER_USER}"
        --file_server_pwd "${FILE_SERVER_PWD_DECODED}"
    # manylinux repair
    - bash scripts/hcu/repair_manylinux.sh
    # repair wheel
    - CIUpload REPAIR --dtk_version $(echo ${DTK_PKG} | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.') --torch_version ${TORCH_VERSION} --git_commit $(git rev-parse --short=6 HEAD) --outputdir output -f dist/*.whl
    # upload
    - CIUpload --devpi_url ${DEVPI_URL} --devpi_user ${devpi_nightly_user} --devpi_password ${devpi_nightly_password} --dtk_pkg_name $(basename ${DTK_PKG}) -f output/*.whl
  artifacts:
    paths:
      - output/*.whl
    expire_in: 30 days

# Mirror only release/3.6.x to GitHub (read-mostly public mirror).
mirror:github:
  stage: mirror
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "release/3.6.x"'
  tags:
    - nmz
  script:
    - test -n "${GITHUB_MIRROR_TOKEN}" || (echo "GITHUB_MIRROR_TOKEN is not set in CI Variables" && exit 1)
    - test -n "${GITHUB_MIRROR_REPO}" || (echo "GITHUB_MIRROR_REPO is not set" && exit 1)
    # Ensure full branch history is available for a non-shallow push.
    - git fetch --unshallow origin "${CI_COMMIT_REF_NAME}" 2>/dev/null || git fetch origin "${CI_COMMIT_REF_NAME}"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@${GITHUB_MIRROR_REPO}"
    # Fetch tip so --force-with-lease has a local expectation to compare against.
    - git fetch github "${CI_COMMIT_REF_NAME}:refs/remotes/github/${CI_COMMIT_REF_NAME}" || true
    # One-way mirror: GitLab is source of truth; refuse if GitHub moved since fetch.
    - git push --force-with-lease=refs/heads/${CI_COMMIT_REF_NAME}:refs/remotes/github/${CI_COMMIT_REF_NAME} github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
    - 'echo "Mirrored ${CI_COMMIT_REF_NAME}@$(git rev-parse --short HEAD) -> ${GITHUB_MIRROR_REPO}"'
