stages:
  - quality-gate
  - build
  - publish
  - mirror

variables:
  # PYPI_URL、RESOURCE_SERVER_URL、HARBOR_SITE 由 CI Variables 提供；
  # PIP_INDEX_URL / PIP_TRUSTED_HOST 由各 job 按 DTK 版本从 PYPI_URL 推导
  CISMI_TIMEOUT: "3600"
  TORCH_VERSION: "2.11.0"
  # GitHub mirror target (override in CI Variables if needed).
  # Auth: set masked CI Variable GITHUB_MIRROR_TOKEN (fine-grained PAT with contents:write).
  GITHUB_MIRROR_REPO: "github.com/HYGON-AI/triton-das.git"

quality-gate:
  stage: quality-gate
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(release\/|staging)/'
  tags:
    - nmz
  script:
    - test -n "${PYPI_URL}" || (echo "PYPI_URL is not set for this pipeline (check CI/CD Variables; protected variables are not available to unprotected branches)" && exit 1)
    - export PIP_INDEX_URL="${PYPI_URL%/}/nightly/dtk/+simple/"
    - export PIP_TRUSTED_HOST=$(echo "${PIP_INDEX_URL}" | sed -E 's#^[A-Za-z]+://##; s#[:/].*$##')
    - pip install hygon_quality_gate[scanners] -i "${PIP_INDEX_URL}" --trusted-host "${PIP_TRUSTED_HOST}"
    - python -m hygon_pr_gate.install_tools
    # 拉取目标分支，供 --base 对比
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - quality-pr-scan --base origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} --head ${CI_COMMIT_SHA}

build:triton-wheel:
  stage: build
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(release\/|staging)/'
  tags:
    - nmz
  parallel:
    matrix:
      - DTK_IMAGE_TAG: ["26.10-rockylinux8.6-py3.12"]
  image: "${HARBOR_SITE}/hcu/base/dtk:${DTK_IMAGE_TAG}"
  before_script:
    # 加载 DTK 环境（镜像内已预装 DTK）
    - source /opt/dtk/env.sh && cd ${CI_PROJECT_DIR}
    # 从镜像 tag 推导 DTK 版本，用于 pip 源和 CIUpload 参数
    - export DTK_VERSION="${DTK_IMAGE_TAG%%-*}"
    - test -n "${DTK_VERSION}" || (echo "Cannot parse DTK version from ${DTK_IMAGE_TAG}" && exit 1)
    # 按镜像内 DTK 版本切换 pip 源，确保 torch 等包从对应 dtk 版本的索引下载
    - test -n "${PYPI_URL}" || (echo "PYPI_URL is not set for this pipeline (check CI/CD Variables; protected variables are not available to unprotected branches)" && exit 1)
    - export PIP_INDEX_URL="${PYPI_URL%/}/nightly/dtk$(echo ${DTK_VERSION} | tr -d '.')/+simple/"
    - export PIP_TRUSTED_HOST=$(echo "${PIP_INDEX_URL}" | sed -E 's#^[A-Za-z]+://##; s#[:/].*$##')
    # 安装 AICC（安装脚本会自动检测 DTK 环境，无需指定版本）
    - wget ${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh
    - bash hcu_llvm_installer.sh
    # git 免密配置 (GIT_ASKPASS 方式，不修改 remote URL)
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod +x /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 GIT_TOKEN="${CI_JOB_TOKEN}"
    # 合并目标分支
    - git config user.email "ci@.local" && git config user.name "CI"
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git merge origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --no-edit
    - pip install -r python/test-requirements.txt -i https://mirrors.cloud.tencent.com/pypi/simple/ --trusted-host mirrors.cloud.tencent.com
    - pip install torch==${TORCH_VERSION} cismi patchelf==0.17.2.4
    - pip install numpy==2.1.0
    - pip install amdsmi==1.0.0+630c16a6.dirty
    - yum install -y expect rsync
  script:
    - export FILE_SERVER_PWD_DECODED=$(echo -n "${FILE_SERVER_PWD}" | base64 -d)
    - test -n "${HCU_LLVM_TRITON_GIT_URL}" || (echo "HCU_LLVM_TRITON_GIT_URL is not set" && exit 1)
    # 构建并修复 manylinux wheel（默认执行 repair）
    - bash scripts/hcu/build_hcu_wheel.sh
        --llvm-repo "http://gitlab-ci-token:${CI_JOB_TOKEN}@${HCU_LLVM_TRITON_GIT_URL}"
        --file-server-ip "${FILE_SERVER_IP}"
        --file-server-user "${FILE_SERVER_USER}"
        --file-server-pwd "${FILE_SERVER_PWD_DECODED}"
    - pip install dist/*manylinux*.whl
    - export HIP_VISIBLE_DEVICES=$(CIsmi need 1 --timeout ${CISMI_TIMEOUT})
    - bash third_party/hcu/test/regression.sh
    - python -m pytest -s third_party/hcu/test/test_hcutuner.py
    - python -m pytest -s third_party/hcu/test/test_fast_jit.py
  artifacts:
    paths:
      - dist/*.whl
      - third_party/hcu/test/hcu_regression.xml
    reports:
      junit: third_party/hcu/test/hcu_regression.xml
    expire_in: 7 days

publish:
  stage: publish
  image: "${HARBOR_SITE}/hcu/base/dtk:${DTK_IMAGE_TAG}"
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME =~ /^(release\/|staging)/'
  tags:
    - nmz
  parallel:
    matrix:
      # 版本对应关系: triton 3.4.0 <-> torch 2.8.0, 3.5.1 <-> 2.9.0, 3.6.0 <-> 2.10.0/2.11.0
      - TRITON_VERSION: ["3.4.0"]
        TORCH_VERSION: ["2.8.0"]
        DTK_IMAGE_TAG: ["26.10-rockylinux8.6-py3.12"]
      - TRITON_VERSION: ["3.5.1"]
        TORCH_VERSION: ["2.9.0"]
        DTK_IMAGE_TAG: ["26.10-rockylinux8.6-py3.12"]
      - TRITON_VERSION: ["3.6.0"]
        TORCH_VERSION: ["2.10.0"]
        DTK_IMAGE_TAG:
          - "26.04-rockylinux8.6-py3.10"
          - "26.10-rockylinux8.6-py3.12"
      - TRITON_VERSION: ["3.6.0"]
        TORCH_VERSION: ["2.11.0"]
        DTK_IMAGE_TAG:
          - "26.04-rockylinux8.6-py3.10"
          - "26.10-rockylinux8.6-py3.12"
  before_script:
    # 加载 DTK 环境（镜像内已预装 DTK）
    - source /opt/dtk/env.sh && cd ${CI_PROJECT_DIR}
    # 从镜像 tag 推导 DTK 版本，用于 pip 源和 CIUpload 参数
    - export DTK_VERSION="${DTK_IMAGE_TAG%%-*}"
    - test -n "${DTK_VERSION}" || (echo "Cannot parse DTK version from ${DTK_IMAGE_TAG}" && exit 1)
    # 按镜像内 DTK 版本切换 pip 源，确保 torch 等包从对应 dtk 版本的索引下载
    - test -n "${PYPI_URL}" || (echo "PYPI_URL is not set for this pipeline (check CI/CD Variables; protected variables are not available to unprotected branches)" && exit 1)
    - export PIP_INDEX_URL="${PYPI_URL%/}/nightly/dtk$(echo ${DTK_VERSION} | tr -d '.')/+simple/"
    - export PIP_TRUSTED_HOST=$(echo "${PIP_INDEX_URL}" | sed -E 's#^[A-Za-z]+://##; s#[:/].*$##')
    # 安装 AICC（安装脚本会自动检测 DTK 环境，无需指定版本）
    - wget ${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh
    - bash hcu_llvm_installer.sh
    # git 免密配置 (GIT_ASKPASS 方式，不修改 remote URL)
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod +x /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 GIT_TOKEN="${CI_JOB_TOKEN}"
    - pip install torch==${TORCH_VERSION} ciupload patchelf==0.17.2.4
  script:
    - export FILE_SERVER_PWD_DECODED=$(echo -n "${FILE_SERVER_PWD}" | base64 -d)
    - test -n "${HCU_LLVM_TRITON_GIT_URL}" || (echo "HCU_LLVM_TRITON_GIT_URL is not set" && exit 1)
    # 构建并修复 manylinux wheel（默认执行 repair）
    - bash scripts/hcu/build_hcu_wheel.sh
        --llvm-repo "http://gitlab-ci-token:${CI_JOB_TOKEN}@${HCU_LLVM_TRITON_GIT_URL}"
        --file-server-ip "${FILE_SERVER_IP}"
        --file-server-user "${FILE_SERVER_USER}"
        --file-server-pwd "${FILE_SERVER_PWD_DECODED}"
    # repair wheel (only manylinux wheels, plain linux_x86_64 is not uploaded)
    - CIUpload REPAIR --dtk_version $(echo ${DTK_VERSION} | tr -d '.') --torch_version ${TORCH_VERSION} --git_commit $(git rev-parse --short=6 HEAD) --outputdir output -f dist/*manylinux*.whl
    # upload
    - CIUpload NIGHTLY --password ${devpi_nightly_password} --dtk_version $(echo ${DTK_VERSION} | tr -d '.') -f output/*.whl --record
  artifacts:
    paths:
      - output/*.whl
    expire_in: 30 days

# Mirror only release/3.6.x to GitHub (read-mostly public mirror).
mirror:github:
  stage: mirror
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "release/3.6.x"'
  tags:
    - nmz
  script:
    - test -n "${GITHUB_MIRROR_TOKEN}" || (echo "GITHUB_MIRROR_TOKEN is not set in CI Variables" && exit 1)
    - test -n "${GITHUB_MIRROR_REPO}" || (echo "GITHUB_MIRROR_REPO is not set" && exit 1)
    # Ensure full branch history is available for a non-shallow push.
    - git fetch --unshallow origin "${CI_COMMIT_REF_NAME}" 2>/dev/null || git fetch origin "${CI_COMMIT_REF_NAME}"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@${GITHUB_MIRROR_REPO}"
    # One-way mirror: GitLab is source of truth; always overwrite the GitHub tip.
    - git push --force github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
    - 'echo "Mirrored ${CI_COMMIT_REF_NAME}@$(git rev-parse --short HEAD) -> ${GITHUB_MIRROR_REPO}"'
